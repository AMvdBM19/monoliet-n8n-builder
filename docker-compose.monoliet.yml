# docker-compose.monoliet.yml
# Monoliet VPS deployment configuration
# Deploy at: /opt/docker/monoliet-n8n-builder
# Usage: docker-compose -f docker-compose.monoliet.yml up -d
version: '3.8'

services:
  n8n-builder:
    build: .
    container_name: monoliet-n8n-builder
    restart: unless-stopped

    environment:
      # Server Configuration
      MCP_MODE: ${MCP_MODE:-http}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0

      # Authentication (required for HTTP mode)
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required - generate with: openssl rand -base64 32}

      # Database
      NODE_DB_PATH: ${NODE_DB_PATH:-/app/data/nodes.db}
      REBUILD_ON_START: ${REBUILD_ON_START:-false}

      # n8n Integration (optional - enables workflow management)
      N8N_API_URL: ${N8N_API_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_API_TIMEOUT: ${N8N_API_TIMEOUT:-30000}
      N8N_API_MAX_RETRIES: ${N8N_API_MAX_RETRIES:-3}

      # Disable telemetry
      N8N_MCP_TELEMETRY_DISABLED: "true"

    volumes:
      - ./data:/app/data

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    networks:
      - web

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:$${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      - "project=monoliet"
      - "service=n8n-builder"

networks:
  web:
    external: true
